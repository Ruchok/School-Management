{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login — School Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <style>
        body {
            /* Reset body background to remove auth-wallpaper */
            background: #f2f5f3; 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: "Outfit", sans-serif;
        }
        .content-auth {
            width: min(400px, 100%);
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(16, 37, 26, 0.08); /* Matches app.css var(--shadow-card) */
            padding: 30px;
            text-align: left;
            border: 1px solid #dce8e1; /* var(--border) */
        }
        .school-hero {
            margin: 0 auto 20px;
            padding: 16px;
            border-radius: 12px;
            background: var(--primary);
            text-align: center;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(22, 168, 113, 0.2);
        }
        .school-hero .school-tag {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
            margin-bottom: 4px;
            opacity: 0.85;
        }
        .school-hero h1 {
            font-size: 16px;
            margin: 0;
            font-family: "Space Grotesk", sans-serif;
            line-height: 1.3;
        }
        .login-role-badge {
            background: rgba(22, 168, 113, 0.1);
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            display: inline-block;
            font-weight: 600;
            font-size: 12px;
            margin-bottom: 12px;
        }
        .subtitle {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 24px;
        }
        form label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--ink);
        }
        form input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            margin-bottom: 16px;
            background: #ffffff;
            color: var(--ink);
            transition: all 0.2s ease;
        }
        form input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(22, 168, 113, 0.1);
        }
        .btn-student {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s ease;
        }
        .btn-student:hover {
            background: var(--primary-dark);
        }
        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .alert-error {
            background: var(--danger-light);
            color: var(--danger);
            border: 1px solid rgba(231, 76, 76, 0.2);
        }
        .alert-success {
            background: var(--primary-light);
            color: var(--primary);
            border: 1px solid rgba(22, 168, 113, 0.2);
        }
    </style>
</head>
<body>
<div class="content-auth">
    <section class="school-hero">
        <p class="school-tag">Student Portal</p>
        <h1>ISLAMPUR GVT.JJKM GIRLS HIGHSCHOOL AND COLLEGE</h1>
    </section>
    <div class="card">
        <div class="login-role-badge">👩‍🎓 Student Sign In</div>
        <p class="subtitle">Access your results, attendance, and fee information.</p>

        {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <label for="id_username">Username</label>
            <input type="text" name="username" id="id_username" required autofocus
                   value="{{ username|default:'' }}" placeholder="Your student username">
            
            <label for="id_password">Password</label>
            <input type="password" name="password" id="id_password" required
                   placeholder="Your password">
            
            <button class="btn-student" type="submit">Sign In as Student</button>
        </form>
    </div>
</div>
</body>
</html>
